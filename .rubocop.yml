inherit_mode:
  merge:
    - Exclude

AllCops:
  TargetRubyVersion: 2.0
  NewCops: enable
  SuggestExtensions: false

# ── Permanently disabled (by design) ─────────────────────────────────────────

# Not required for a fastlane plugin
Style/Documentation:
  Enabled: false

# Fastlane config keys use camelCase by convention
Naming/VariableName:
  Enabled: false

Naming/MethodParameterName:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false

# Standard for gem plugins; gemspec manages dev deps intentionally
Gemspec/DevelopmentDependencies:
  Enabled: false

# .ruby-version and gemspec version may intentionally differ
Gemspec/RequiredRubyVersion:
  Enabled: false

# ── Disabled temporarily – enable & fix one by one in follow-up PRs ──────────

Layout/ArrayAlignment:
  Enabled: false

Layout/BlockAlignment:
  Enabled: false

Layout/CommentIndentation:
  Enabled: false

Layout/ConditionPosition:
  Enabled: false

Layout/ElseAlignment:
  Enabled: false

